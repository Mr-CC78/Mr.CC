<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易登录界面</title>
    <!-- 引入css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">

    <!-- ========== 左侧：轮播展示区 ========== -->
    <section class="left-carousel-wrap" aria-label="轮播展示区">
        <div class="carousel-box">
            <div class="carousel-inner">
                <figure class="card-item active">
                    <img class="round-img" src="./img/登录界面.jpg" alt="登录页展示图">
                </figure>

                <button class="revolve left" type="button" onclick="left()" aria-label="上一张">
                    <img class="revolve-img left" src="./img/切换器左.png" alt="">
                </button>
                <button class="revolve right" type="button" onclick="right()" aria-label="下一张">
                    <img class="revolve-img right" src="./img/切换器右.png" alt="">
                </button>
            </div>
        </div>
    </section>

    <!-- ========== 右侧：登录表单区 ========== -->
    <section class="register-box" aria-label="登录表单区">
        <form class="input-box" onsubmit="return false;">
            <div class="quary">
                    <img src="./img/二维码.png" alt="二维码登录">
                </div>
            <!-- 头部：标题-->
            <header class="form-header">
                <div class="check-in">
                    <h1>Welcome , Master</h1>
                </div>
                
            </header>

            <!-- 账号 -->
            <div class="field">
                <label class="all-title" for="account">账号</label>
                <div class="input-wrap">
                    <input id="account" type="text" class="putin-box reg" placeholder="请输入账号" autocomplete="username">
                    <button class="clear-btn" type="button" aria-label="清空账号">
                        <svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true">
                            <line x1="2" y1="2" x2="8" y2="8"></line>
                            <line x1="8" y1="2" x2="2" y2="8"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 密码 -->
            <div class="field">
                <label class="all-title" for="password">密码</label>
                <div class="input-wrap">
                    <input id="password" type="password" class="putin-box pwd" placeholder="请输入密码" autocomplete="current-password">
                    <button class="clear-btn" type="button" aria-label="清空密码">
                        <svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true">
                            <line x1="2" y1="2" x2="8" y2="8"></line>
                            <line x1="8" y1="2" x2="2" y2="8"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 找回密码 -->
            <div class="found-box">
                <button class="found-text" type="button" onclick="found()">找回密码</button>
            </div>

            <!-- 其他登录方式 -->
            <div class="choose-box" id="chooseBox">
                <button class="choose-text" type="button" onclick="chooseSign()" aria-expanded="false" aria-controls="otherLogin">
                    选择其他登录方式 <span class="arrow">&gt;</span>
                </button>

                <!-- 展开面板：三个登录方式圆圈（换成你自己的图片即可） -->
                <div class="other-login" id="otherLogin">
                    <div class="other-login-inner">
                        <button class="circle-btn" type="button" data-way="微信" onclick="pickWay(this)" title="微信登录">
                            <img src="./img/微信.png" alt="微信登录">
                        </button>
                        <button class="circle-btn" type="button" data-way="QQ" onclick="pickWay(this)" title="QQ登录">
                            <img src="./img/qq.png" alt="QQ登录">
                        </button>
                        <button class="circle-btn" type="button" data-way="抖音" onclick="pickWay(this)" title="抖音登录">
                            <img src="./img/抖音.png" alt="抖音登录">
                        </button>
                    </div>
                </div>
            </div>

            <!-- 登录按钮 -->
            <div class="sign">
                <button class="sign-button" type="submit"><span>登录</span></button>
            </div>
            <!-- 协议勾选区 -->
             <div class="policy" id="policy">
                <label class="policy-box">
                    <input type="checkbox" class="agree-btn">
                    <span class="cb-visual">✓
                        
                    </span>
                    <span class="policy-text">
                        已阅读并同意以下协议
                        <span style="color: rgb(115, 189, 94);">平台服务协议</span>、
                        <span style="color: rgb(115, 189, 94);">隐私权政策</span>、
                        <span style="color: rgb(115, 189, 94);">法律声明</span>、
                        <span style="color: rgb(115, 189, 94);">客户端服务协议</span>
                    </span>              
                </label>
             </div>
        </form>
    </section>

</main>

<!-- 引入js，放body末尾 -->
<script src="script.js"></script>
</body>
</html>
